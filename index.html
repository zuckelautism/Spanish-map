<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spanien – interaktive Karte</title>
<style>
:root{--ink:#1d2433;--muted:#6b7285;--panel:#fffdf8;--line:#ddd5c3;--sea1:#dbe7e8;--sea2:#b7cfd2;--grid:rgba(255,255,255,.35);--grid2:rgba(255,255,255,.55);--accent:#9E2A2B;--shadow:0 10px 30px rgba(30,40,60,.18);--ext:#cfcfc8;--glow:rgba(255,255,255,.8);--vig:rgba(20,50,70,.28);--extb:#b9bab2;--extink:#8a8b84}
@media (prefers-color-scheme:dark){:root{--ink:#eef0f6;--muted:#97a0b8;--panel:#142126;--line:#2c4048;--sea1:#12262d;--sea2:#0b1a1f;--grid:rgba(255,255,255,.04);--grid2:rgba(255,255,255,.08);--accent:#E09F3E;--shadow:0 10px 30px rgba(0,0,0,.5);--ext:#2a3a40;--glow:rgba(90,210,230,.42);--vig:rgba(0,0,0,.55);--extb:#3a4e56;--extink:#6b8088}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea2);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{position:fixed;inset:0;background:radial-gradient(120% 120% at 30% 20%,var(--sea1),var(--sea2))}
#plane{position:absolute;left:-12%;right:-12%;top:-26%;bottom:-8%;transform:perspective(1200px) rotateX(30deg);transform-origin:50% 56.7%;animation:intro 1.7s cubic-bezier(.2,.7,.2,1) both}
@keyframes intro{from{transform:perspective(1200px) rotateX(0deg) scale(1.14);opacity:0}to{transform:perspective(1200px) rotateX(30deg) scale(1);opacity:1}}
#world{filter:url(#lift)}
.moving #world{filter:none}
.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--sea2),transparent 24%),radial-gradient(130% 110% at 50% 58%,transparent 58%,var(--vig) 100%),radial-gradient(55% 38% at 18% 6%,rgba(255,255,255,.3),transparent 70%);pointer-events:none;z-index:1}
#title,.card,#tip{z-index:3}
#plane::before,#plane::after{content:"";position:absolute;inset:-300px;pointer-events:none;z-index:-1;will-change:transform;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
#plane::before{transform:var(--t1,none)}
#plane::after{background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:160px 160px;transform:var(--t2,none)}
#map{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dragging #map,.dragging .r{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.ext{fill:var(--ext);stroke:var(--ext);stroke-width:2;stroke-linejoin:round;pointer-events:none}
.extb{fill:none;stroke:var(--extb);stroke-width:.7;stroke-linejoin:round;pointer-events:none}
.extlbl{font-size:7px;letter-spacing:.12em;fill:var(--extink);text-anchor:middle;pointer-events:none;font-weight:600}
.frame{fill:var(--sea1);stroke:var(--line);stroke-width:1;stroke-dasharray:3 2}
.r{stroke:rgba(255,255,255,.85);stroke-linejoin:round;cursor:pointer;outline:none;transition:opacity .3s,filter .2s,transform .5s cubic-bezier(.2,.8,.2,1)}
.r:hover:not(.sel),.r:focus-visible:not(.sel){stroke:#fff;stroke-width:calc(2px*var(--u,1))!important}
.dim .r:not(.sel){opacity:.28}
.r.sel{stroke:#fff;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.lbl{font-size:6px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(20,25,40,.55);stroke-width:2.2px;stroke-linejoin:round;letter-spacing:.02em}
.zoomed .lbl{display:none}
.zoomed .lbl.sel{display:none}
.cd{fill:#14202a;stroke:#fff;pointer-events:none;display:none}
.cd.sel{display:block}
.cd[data-main]{fill:#fff;stroke:#14202a}
.cn{font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(20,25,40,.75);stroke-linejoin:round;pointer-events:none;display:none}
.cn.sel{display:block}
.rh{opacity:.92;pointer-events:none}
.ch,.cm,.ci{fill:none;pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
.ch{stroke:rgba(255,255,255,.3);stroke-width:calc(2px*var(--u,1))}
.cm{stroke:rgba(15,20,30,.4);stroke-width:calc(.6px*var(--u,1))}
.ci{stroke:rgba(15,20,30,.65);stroke-width:calc(1.1px*var(--u,1))}
#relief{transition:opacity .45s}
.moving #relief{visibility:hidden;opacity:0;transition:none}
.moving .extb,.moving .cd,.moving .cn,.moving .ct{visibility:hidden}
.moving .r.sel{filter:none}
.ct{display:none;font-weight:600;font-style:italic;fill:#fff;paint-order:stroke;stroke:rgba(20,25,40,.7);stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.ct.sel{display:block}
@media (prefers-color-scheme:dark){.ch{stroke:rgba(0,0,0,.3)}.cm{stroke:rgba(255,255,255,.3)}.ci{stroke:rgba(255,255,255,.5)}}
#glow{filter:blur(calc(6px*var(--u,1)))}
#glow path{fill:none;stroke:var(--glow);stroke-width:calc(15px*var(--u,1));stroke-linejoin:round;pointer-events:none}
#under path{fill:#0b1218;opacity:.15;pointer-events:none}
.moving #glow{visibility:hidden}
.card{border-left:6px solid var(--line)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .35s}
#ov.show{opacity:1}
#ov line{stroke:var(--accent);stroke-width:2.5}
#ov .halo{stroke:#fff;stroke-width:6;stroke-linecap:round}
#ov circle{fill:#fff;stroke:var(--accent);stroke-width:3.5}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;transform:translateY(10px)}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.card h2{margin:6px 0 8px;font-size:1.4rem;display:flex;align-items:center;gap:10px}
.card p{margin:0;line-height:1.55}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
#title{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 16px;backdrop-filter:blur(6px);pointer-events:none}
#title h1{margin:0;font-size:1.3rem}
#title p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.zoomed #title{display:none}
.btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;box-shadow:var(--shadow);z-index:4}
#back{left:16px;display:none}.zoomed #back{display:block}
#menuBtn{right:16px}
#menu{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:16px;width:min(320px,calc(100% - 32px));max-height:70%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:none;z-index:4}
#menu.open{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.8rem;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip.sel{background:var(--accent);color:#fff;border-color:transparent}
#tilt{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);backdrop-filter:blur(6px);font-size:.82rem}
#tilt label{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
#tilt b{color:var(--ink)}
#tilt input{width:150px;accent-color:var(--accent)}
@media (max-width:699px){#title p{display:none}#tilt{left:auto;right:16px;bottom:auto;top:calc(62px + env(safe-area-inset-top,0px))}#menu{top:calc(128px + env(safe-area-inset-top,0px))}}
#tip{position:absolute;pointer-events:none;background:rgba(20,25,40,.92);color:#fff;font-size:.8rem;padding:5px 10px;border-radius:8px;opacity:0;transform:translate(-50%,-140%);transition:opacity .15s;white-space:nowrap;z-index:3}
</style>
</head>

    p.setAttribute("fill",r.color); p.setAttribute("class","r");
    p.setAttribute("tabindex","0"); p.setAttribute("role","button"); p.setAttribute("aria-label",r.name); p.dataset.id=id;
    p.addEventListener("click",e=>{e.stopPropagation();if(dragMoved)return;select(id)});
    p.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(id)}});
    p.addEventListener("mousemove",e=>{tip.textContent=r.name;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.style.opacity=1});
    p.addEventListener("mouseleave",()=>tip.style.opacity=0);
  });
  const t=mk("text",{x:r.lx,y:r.ly,class:"lbl","font-size":r.fs},gL); t.dataset.id=id; t.textContent=r.name;
  const c=document.createElement("button"); c.className="chip"; c.textContent=r.name; c.dataset.id=id;
  c.onclick=()=>{list.classList.remove("open");select(id)}; list.appendChild(c);
}

// Küstenglühen und Landdicke (Schichten unter den Provinzen)
(function(){
  const gG=$("glow"), gU=$("under");
  EXT.forEach(x=>mk("path",{d:x.d},gG));
  Object.values(REGIONS).forEach(r=>mk("path",{d:r.d,"fill-rule":"evenodd"},gG));
  for(let k=1;k<=8;k++){const g=mk("g",{},gU);
    for(const [id,r] of Object.entries(REGIONS)) if(id!=="kanaren") mk("path",{d:r.d,"fill-rule":"evenodd"},g)}
})();
(function(){
  const g=$("relief"), f=FRAME, defs=mk("defs",{},svg), cp=mk("clipPath",{id:"nofr"},defs);
  mk("path",{"clip-rule":"evenodd",d:`M-2000 -2000H3000V3000H-2000Z M${f.x} ${f.y}h${f.w}v${f.h}h${-f.w}Z`},cp);
  const gm=mk("g",{"clip-path":"url(#nofr)"},g);
  const gh=mk("g",{"clip-path":"url(#nofr)",class:"rh"},g);
  mk("image",{href:RELIEF.img,x:RELIEF.x,y:RELIEF.y,width:RELIEF.w,height:RELIEF.h,preserveAspectRatio:"none"},gh);
  mk("path",{d:RELIEF.cmin+RELIEF.cmaj,class:"ch"},gm);
  mk("path",{d:RELIEF.cmin,class:"cm"},gm);
  mk("path",{d:RELIEF.cmaj,class:"ci"},gm);
  mk("path",{d:RELIEF.cmin2,class:"cm can"},g); mk("path",{d:RELIEF.cmaj2,class:"ci can"},g);
  const rp=[...gR.querySelectorAll("path.r")];
  RELIEF.labs.forEach(([x,y,t])=>{
    const el=mk("text",{x,y,class:"ct"},$("labels")); el.textContent=t;
    const hit=rp.find(p=>p.isPointInFill(new DOMPoint(x,y))); if(hit) el.dataset.id=hit.dataset.id;
  });
})();
const gC=mk("g",{},svg);
for(const [id,list2] of Object.entries(CITIES)){
  list2.forEach(([n,x,y],i)=>{
    const c=mk("circle",{cx:x,cy:y,r:1.5,class:"cd"},gC); c.dataset.id=id; if(i===0)c.dataset.main=1;
    const t=mk("text",{x:x,y:y,class:"cn"},gC); t.dataset.id=id; t.dataset.x=x; t.dataset.y=y; t.textContent=n;
  });
}
function sizeCities(id,u){
  document.querySelectorAll(".cd").forEach(c=>{const on=c.dataset.id===id,k=c.dataset.main?1.3:1;c.setAttribute("r",((on?4.4:2.5)*k*u).toFixed(2));c.style.strokeWidth=(1.5*u)+"px"});
  document.querySelectorAll(".ct").forEach(t=>{t.style.fontSize=(9*u)+"px";t.style.strokeWidth=(2.4*u)+"px"});
  document.querySelectorAll(".cn").forEach(t=>{
    t.style.fontSize=(11.5*u)+"px"; t.style.strokeWidth=(3.2*u)+"px";
    t.setAttribute("x",+t.dataset.x+7*u); t.setAttribute("y",+t.dataset.y+4*u);
  });
}
function placeCan(){
  const vis=FULL[0]+PL.l*FULL[2]/PL.w, x=Math.max(FRAME.x-48,vis+8); CAN.tx=x-FRAME.x;
  svg.querySelectorAll('.frame,.can,.r[data-id="kanaren"]').forEach(e=>e.setAttribute("transform",`translate(${CAN.tx} 0)`));
}
function setVB(v){vb=v;svg.setAttribute("viewBox",v.join(" "));parallax()}
// Parallax: Hintergrundraster bewegt sich langsamer als die Karte (zwei Ebenen) und skaliert beim Zoomen nur schwach mit
function parallax(){
  const s=cw()/vb[2], s0=cw()/FULL[2], zf=Math.max(1,Math.pow(s/s0,.3)), st=wrap.style;
  const cx=vb[0]+vb[2]/2-(FULL[0]+FULL[2]/2), cy=vb[1]+vb[3]/2-(FULL[1]+FULL[3]/2);
  const f=(k,size,fac)=>{const t=size*zf; st.setProperty(k,`translate(${((-cx*s*fac)%t).toFixed(1)}px,${((-cy*s*fac)%t).toFixed(1)}px) scale(${zf.toFixed(3)})`)};
  f("--t1",32,.3); f("--t2",160,.6);
}
function animateTo(target,done){
  cancelAnimationFrame(anim); cancelAnimationFrame(inertia); wrap.classList.add("moving"); lowerLift();
  const from=vb.slice(), t0=performance.now(), dur=700;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    setVB(from.map((f,i)=>f+(target[i]-f)*e));
    if(k<1) anim=requestAnimationFrame(step); else {wrap.classList.remove("moving"); riseLift(); if(done) done();}
  })(t0);
}
// Zielausschnitt: Region links bzw. oben, Infokarte daneben bzw. darunter (also außerhalb der Region)
function boxFor(id){
  const [a,b,c,d]=REGIONS[id].bb, t=id==="kanaren"?CAN.tx:0, x0=a+t, x1=c+t, y0=b, y1=d, W=WS(), H=HS();
  const bw=Math.max(x1-x0,12), bh=Math.max(y1-y0,12), land=W>=700;
  let s,sx,sy;
  if(land){const free=W-CARDW-70; s=Math.min((free-90)/bw,(H-150)/bh,W/90); sx=free/2+12; sy=H/2}
  else{const fh=H-Math.max(card.offsetHeight,150)-40; s=Math.min((W-48)/bw,(fh-100)/bh,W/90); sx=W/2; sy=70+(fh-70)/2}
  const OX=PL.l*W, OY=PL.t*H;
  return [(x0+x1)/2-(sx+OX)/s,(y0+y1)/2-(sy+OY)/s,PL.w*W/s,PL.h*H/s];
}
function place(id){
  applyTop();
  const W=WS(), H=HS(), land=W>=700;
  if(land){card.style.width=CARDW+"px";card.style.left=(W-CARDW-24)+"px";card.style.top=Math.max(70,(H-card.offsetHeight)/2)+"px"}
  else{card.style.width=(W-24)+"px";card.style.left="12px";card.style.top=(H-card.offsetHeight-12)+"px"}
  card.classList.add("show");
}
function mark(id,u){
  POP=14*u; svg.style.setProperty("--u",u);
  const U=$("under"); if(U){const n=U.children.length; [...U.children].forEach((g,i)=>g.setAttribute("transform",`translate(0 ${(7*u*(i+1)/n).toFixed(2)})`))} sizeCities(id,u);
  document.querySelectorAll("[data-id]").forEach(el=>{
    const on=el.dataset.id===id; el.classList.toggle("sel",on);
    if(el.classList.contains("r")){el.style.strokeWidth=(on?2.2:.9)*u+"px";el.style.transform=on?`translateY(${-14*u}px)`:""}
  });
}
function hideCard(){card.classList.remove("show")}
function select(id){
  selected=id; tip.style.opacity=0; hideCard();
  const r=REGIONS[id];
  card.style.borderLeftColor=r.color;
  card.innerHTML=`<span class="tag">Region</span><h2><span class="dot" style="background:${r.color}"></span>${r.name}</h2><p>${r.text}</p>`;
  card.style.width=(WS()>=700?CARDW:WS()-24)+"px";
  const bx=boxFor(id); mark(id,bx[2]/cw());
  wrap.classList.add("dim","zoomed"); animateTo(bx,()=>place(id));
}
function reset(){
  selected=null; hideCard(); mark(null,FULL[2]/cw()); applyTop();
  wrap.classList.remove("dim","zoomed"); FULL=fullBox(); animateTo(FULL);
}
placeCan(); mark(null,FULL[2]/cw()); parallax();
$("back").onclick=e=>{e.stopPropagation();reset()};
$("menuBtn").onclick=e=>{e.stopPropagation();list.classList.toggle("open")};
svg.addEventListener("click",()=>{list.classList.remove("open");if(dragMoved)return;if(selected)reset()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){list.classList.remove("open");if(selected)reset()}});
// 3D-Relief: Höhendaten verschieben die Karte vertikal (SVG-Filter). Beim Bewegen flach, danach hebt sich das Relief sanft.
const dmap=$("dmap"), dmimg=$("dmimg"), liftIn=$("liftIn"), tv=$("tv"), S0=55;
dmimg.setAttribute("x",RELIEF.dmx); dmimg.setAttribute("y",RELIEF.dmy); dmimg.setAttribute("width",RELIEF.dmw); dmimg.setAttribute("height",RELIEF.dmh);
dmimg.setAttribute("href",RELIEF.dm); dmimg.setAttributeNS("http://www.w3.org/1999/xlink","href",RELIEF.dm);
let LIFT=1, liftCur=0, liftAnim=0;
try{const t=localStorage.getItem("lift"); if(t!==null){liftIn.value=Math.min(200,Math.max(0,+t)); LIFT=liftIn.value/100; tv.textContent=liftIn.value+"%"}}catch(e){}
// Beschriftungen/Punkte liegen außerhalb des Filters und werden mit der Geländehöhe angehoben
const TOP=[]; let dmData=null;
const dmI=new Image();
dmI.onload=()=>{
  const c=document.createElement("canvas"); c.width=dmI.width; c.height=dmI.height;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(dmI,0,0); dmData=g.getImageData(0,0,c.width,c.height);
  document.querySelectorAll(".lbl,.cd,.cn,.ct").forEach(el=>{
    const circ=el.tagName==="circle", x=circ?+el.getAttribute("cx"):+(el.dataset.x||el.getAttribute("x")), y=circ?+el.getAttribute("cy"):+(el.dataset.y||el.getAttribute("y"));
    const kan=el.dataset.id==="kanaren";
    const px=Math.min(dmData.width-1,Math.max(0,Math.round((x-RELIEF.dmx)*dmData.width/RELIEF.dmw))), py=Math.min(dmData.height-1,Math.max(0,Math.round((y-RELIEF.dmy)*dmData.height/RELIEF.dmh)));
    TOP.push({el,kan,id:el.dataset.id,g:kan?0:dmData.data[(py*dmData.width+px)*4]/255-.5});
  });
  applyTop();
};
dmI.src=RELIEF.dm;
function applyTop(){const sc=S0*LIFT*liftCur; for(const t of TOP) t.el.setAttribute("transform",`translate(${t.kan?CAN.tx:0} ${(-sc*t.g-(t.id===selected?POP:0)).toFixed(2)})`)}
function setLift(v){liftCur=v;dmap.setAttribute("scale",(S0*LIFT*v).toFixed(1));applyTop()}
function fitFilter(){const f=$("lift"),m=.08;f.setAttribute("x",vb[0]-vb[2]*m);f.setAttribute("y",vb[1]-vb[3]*m);f.setAttribute("width",vb[2]*(1+2*m));f.setAttribute("height",vb[3]*(1+2*m))}
function lowerLift(){cancelAnimationFrame(liftAnim);setLift(0)}
function riseLift(){
  cancelAnimationFrame(liftAnim); fitFilter();
  const t0=performance.now(), from=liftCur;
  (function st(now){const k=Math.min(1,(now-t0)/550), e=1-Math.pow(1-k,3); setLift(from+(1-from)*e); if(k<1) liftAnim=requestAnimationFrame(st)})(t0);
}
liftIn.addEventListener("input",()=>{LIFT=liftIn.value/100;tv.textContent=liftIn.value+"%";setLift(liftCur);try{localStorage.setItem("lift",liftIn.value)}catch(e){}});

// Verschieben mit Maus oder Finger (mit Schwung)
const CB={x:[10,520],y:[40,500]};
function clampV(v){
  const cx=Math.min(Math.max(v[0]+v[2]/2,CB.x[0]),CB.x[1]), cy=Math.min(Math.max(v[1]+v[3]/2,CB.y[0]),CB.y[1]);
  return [cx-v[2]/2,cy-v[3]/2,v[2],v[3]];
}
svg.addEventListener("pointerdown",e=>{
  if(e.button>0) return;
  cancelAnimationFrame(inertia); dragMoved=false; vel=[0,0];
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),started:false};
});
svg.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    drag.started=true; dragMoved=true; svg.setPointerCapture(e.pointerId);
    cancelAnimationFrame(anim); wrap.classList.add("dragging"); tip.style.opacity=0; list.classList.remove("open");
    if(HIDE_PAN){wrap.classList.add("moving");lowerLift()}
  }
  const k=vb[2]/cw(), dx=(e.clientX-drag.lx)*k, dy=(e.clientY-drag.ly)*k, now=performance.now(), dt=Math.max(now-drag.t,1);
  vel=[.8*vel[0]+.2*(-dx/dt),.8*vel[1]+.2*(-dy/dt)];
  drag.lx=e.clientX; drag.ly=e.clientY; drag.t=now;
  setVB(clampV([vb[0]-dx,vb[1]-dy,vb[2],vb[3]]));
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id) return;
  const was=drag.started, idle=performance.now()-drag.t; drag=null; wrap.classList.remove("dragging");
  if(!was) return;
  if(idle>90) vel=[0,0];
  let last=performance.now();
  (function step(now){
    const dt=Math.min(now-last,40); last=now; const f=Math.pow(.93,dt/16);
    vel=[vel[0]*f,vel[1]*f];
    if(Math.hypot(vel[0],vel[1])<.003){wrap.classList.remove("moving");riseLift();return}
    setVB(clampV([vb[0]+vel[0]*dt,vb[1]+vel[1]*dt,vb[2],vb[3]]));
    inertia=requestAnimationFrame(step);
  })(last);
}
svg.addEventListener("pointerup",endDrag); svg.addEventListener("pointercancel",endDrag);
addEventListener("resize",()=>{
  FULL=fullBox(); placeCan(); applyTop();
  if(selected){cancelAnimationFrame(anim);card.style.width=(WS()>=700?CARDW:WS()-24)+"px";setVB(boxFor(selected));mark(selected,vb[2]/cw());place(selected)}
  else{setVB(FULL);mark(null,FULL[2]/cw())}
});
setTimeout(riseLift,700);
</script>
</body>
</html>
